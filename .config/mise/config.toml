min_version = "2026.7.5"

[settings]
dotfiles.root = "~/repos/dotfiles"
dotfiles.default_mode = "symlink"
lockfile_platforms = ["macos-arm64"]

[tools]
"aqua:fish-shell/fish-shell" = "latest"
"aqua:nushell/nushell" = "latest"
atuin = "latest"
bat = "latest"
bun = "latest"
caddy = "latest"
carapace = "latest"
colima = "latest"
delta = "latest"
docker-compose = "latest"
fzf = "latest"
gh = "latest"
git-lfs = "latest"
"github:boyter/scc" = "latest"
helix = "latest"
lazydocker = "latest"
lazygit = "latest"
lazyssh = "latest"
lima = "latest"
"github:kitlangton/ghui" = "latest"
node = "latest"
"npm:chrome-devtools-mcp" = "latest"
"npm:convex" = "latest"
"npm:skills" = "latest"
pnpm = "latest"
ripgrep = "latest"
ripgrep-all = "latest"
starship = "latest"
usage = "latest"
zoxide = "latest"
java = "latest"

[bootstrap.packages]
"brew:btop" = "latest"
"brew:docker" = "latest"
"brew:git" = "latest"
"brew:libpq" = "latest"
"brew-cask:font-ioskeley-mono" = "latest"

# Scheduled OpenCode tasks (Codex "scheduled tasks" equivalent).
# Prompts live in .config/opencode/scheduled/; runs appear as sessions in the OpenCode app.
# Apply with: mise bootstrap macos launchd-agents apply

[bootstrap.macos.launchd.agents.opencode-weekly-product-log-farmio-service]
program = "/bin/zsh"
args = [
  "-c",
  'p=$(cat "$HOME/.config/opencode/scheduled/weekly-product-log-farmio-service.md") && [ -n "$p" ] || exit 78; exec "/Applications/OpenCode Beta.app/Contents/Resources/opencode-cli" run --auto --title "Weekly Product Log: Farmio Service" --model "openai/gpt-5.6-sol#low" "$p"',
]
working_directory = "~/repos/farmio-service"
start_calendar_interval = { weekday = 1, hour = 8, minute = 45 }
environment = { PATH = "/Users/bjt/.local/share/mise/shims:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/opencode-scheduled-weekly-product-log-farmio-service.log"
stderr_path = "~/Library/Logs/opencode-scheduled-weekly-product-log-farmio-service.err.log"

[bootstrap.macos.launchd.agents.opencode-weekly-work-evidence-notion]
program = "/bin/zsh"
args = [
  "-c",
  'p=$(cat "$HOME/.config/opencode/scheduled/weekly-work-evidence-notion.md") && [ -n "$p" ] || exit 78; exec "/Applications/OpenCode Beta.app/Contents/Resources/opencode-cli" run --auto --title "Weekly Work Evidence: Notion" --model "openai/gpt-5.6-sol#xhigh" "$p"',
]
working_directory = "~/repos/farmio-service"
start_calendar_interval = { weekday = 1, hour = 9, minute = 0 }
environment = { PATH = "/Users/bjt/.local/share/mise/shims:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/opencode-scheduled-weekly-work-evidence-notion.log"
stderr_path = "~/Library/Logs/opencode-scheduled-weekly-work-evidence-notion.err.log"

# Daily machine maintenance: runs the Nushell `up` command (tool upgrades,
# package prune, cache cleanup, colima restart, shell integrations).
[bootstrap.macos.launchd.agents.up-daily]
program = "/Users/bjt/.local/share/mise/shims/nu"
args = ["-l", "-c", "up"]
working_directory = "~"
start_calendar_interval = { hour = 7, minute = 0 }
environment = { PATH = "/Users/bjt/.local/bin:/Users/bjt/.local/share/mise/shims:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/up-daily.log"
stderr_path = "~/Library/Logs/up-daily.err.log"

[dotfiles]
"~/.agents/.skill-lock.json" = {}
"~/.agents/skills" = { mode = "symlink-each" }
"~/.local/bin/oc" = { source = "~/repos/dotfiles/.local/bin/opencode" }
"~/.local/bin/opencode" = {}
"~/.local/bin/opencode2" = { source = "~/repos/dotfiles/.local/bin/opencode" }
"~/.zprofile" = {}
"~/.zshenv" = {}
"~/.zshrc" = {}
"~/Applications/OpenCode Beta Reduced Motion.app" = {}
"~/.gitconfig" = {}
"~/.gitignore" = {}
"~/.claude/CLAUDE.md" = { source = "~/repos/dotfiles/.codex/AGENTS.md", mode = "symlink" }
"~/.claude/skills" = { source = "~/repos/dotfiles/.agents/skills", mode = "symlink-each" }
"~/.codex/AGENTS.md" = {}
"~/.config/bat" = {}
"~/.config/btop/themes" = { mode = "symlink-each" }
"~/.config/ghostty/themes" = { mode = "symlink-each" }
"~/.config/helix" = { mode = "symlink-each" }
"~/.config/mise" = { mode = "symlink-each" }
"~/.config/opencode" = { mode = "symlink-each" }
"~/.config/opencode/AGENTS.md" = { source = "~/repos/dotfiles/.codex/AGENTS.md", mode = "symlink" }
"~/.config/zed" = { mode = "symlink-each" }
"~/Library/Application Support/carapace" = {}
"~/Library/Application Support/com.mitchellh.ghostty/config" = {}
"~/Library/Application Support/lazygit/config.yml" = {}
"~/Library/Application Support/nushell/config.nu" = {}

[tasks.bootstrap]
description = "Generate Nushell integrations and register Docker Compose"
dir = "~/repos/dotfiles"
run = """
nu -c 'source "Library/Application Support/nushell/config.nu"; ensure-docker-compose-plugin; init'
"""
